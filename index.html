<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 미래융합부 교육활동 가이드</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel CDN (JSX 변환용) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap');
        body { font-family: 'Pretendard', sans-serif; -webkit-font-smoothing: antialiased; }
        .animate-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* Lucide 아이콘 중앙 정렬 보정 */
        .lucide-icon { vertical-align: middle; display: inline-block; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>

    <!-- type="text/babel"을 명시해야 브라우저가 React 문법을 해석합니다 -->
    <script type="text/babel">
        // 브라우저 환경에서는 import 대신 전역 변수를 사용합니다
        const { useState, useEffect } = React;

        // 아이콘 컴포넌트 (Lucide 아이콘을 React에서 렌더링하기 위함)
        const Icon = ({ name, size = 20, className = "" }) => {
            useEffect(() => {
                // DOM 업데이트 후 아이콘 생성
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [name]);
            return <i data-lucide={name} style={{ width: size, height: size }} className={`lucide-icon ${className}`}></i>;
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [copiedId, setCopiedId] = useState(null);

            const activities = [
                {
                    id: 'lab',
                    title: '과학실 운영 및 봉사',
                    icon: 'beaker',
                    period: '1학기 마감, 2학기 추후 모집',
                    target: '전교생 (희망자)',
                    color: 'bg-blue-500',
                    details: [
                        '실험 봉사: 기자재 정리 및 실험 보조',
                        '행사 봉사: 수학·과학 행사 안내, 환경공감 독서쉼터 운영'
                    ],
                    benefit: '봉사시간 인정 (생활기록부 기재 대상 제외)'
                },
                {
                    id: 'bridger',
                    title: '융합 브리저 (모집완)',
                    icon: 'users',
                    period: '연중',
                    target: '과학·환경 관심을 가지고 기획 및 운영할 학생',
                    color: 'bg-purple-500',
                    details: [
                        '수학-AI 체험전 기획 및 운영(참여학생 별도 모집)',
                        'AI 융합 프로그램 운영',
                        '수학 AI 경시대회 기획 및 운영',
                        '과학 실험 및 방탈출 행사 기획'
                    ],
                    recordPoint: '자기주도성, 기획력, 갈등 관리, 협업 역량',
                    benefit: '자율활동 기록 가능'
                },
                {
                    id: 'club',
                    title: '융합과학콘서트(모집완)',
                    icon: 'cpu',
                    period: '1학기 7월 초 발표',
                    target: '과학 탐구프로젝트 수행 학생',
                    color: 'bg-indigo-500',
                    details: [
                        '이공계 관련 자유주제탐구 수행',
                        '탐구보고서 작성 및 제출',
                        '창의·예술적 방식으로 발표하는 콘서트'
                    ],
                    recordPoint: '전공 전문성, 창의·융합적 사고, 학술적 탐구 역량',
                    benefit: '자율활동 기록 가능'
                },
                {
                    id: 'bms',
                    title: 'BMS 캠프(추가모집 예정)',
                    icon: 'stethoscope',
                    period: '1학기 7월 21~23일',
                    target: '보건·의료·생명, 의료 AI 계열 희망자',
                    color: 'bg-rose-500',
                    details: [
                        '대학 연계 보건의료 전문 강의 (간호, 임상병리, 의료AI)',
                        '대학 실습실 기반 프로젝트 수행'
                    ],
                    recordPoint: '심화 탐구 능력, 의료 윤리, 전공 적합성',
                    benefit: '동아리 활동 기록 가능'
                },
                {
                    id: 'changemaker',
                    title: '환경 체인지 메이커(모집완)',
                    icon: 'leaf',
                    period: '연중',
                    target: '환경, ESG, AI에 관심 있는 학생',
                    color: 'bg-emerald-500',
                    details: [
                        '지역 환경 문제 진단 및 데이터 수집',
                        'AI 예측 모델을 활용한 해결 방안 도출',
                        '환경공감 콘서트 (클래식 AI 융합 캠페인)'
                    ],
                    recordPoint: '디지털 리터러시, 문제 해결력, 사회적 실천력',
                    benefit: '자율활동 기록 가능'
                }
            ];

            const handleCopy = (text, id) => {
                const el = document.createElement('textarea');
                el.value = text;
                document.body.appendChild(el);
                el.select();
                document.execCommand('copy');
                document.body.removeChild(el);
                setCopiedId(id);
                setTimeout(() => setCopiedId(null), 2000);
            };

            return (
                <div className="min-h-screen pb-24 md:pb-0">
                    {/* Header */}
                    <header className="bg-white border-b border-slate-200 sticky top-0 z-20 shadow-sm">
                        <div className="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
                            <div className="flex items-center gap-2">
                                <div className="bg-blue-600 p-2 rounded-lg text-white">
                                    <Icon name="cpu" size={24} />
                                </div>
                                <h1 className="text-xl font-bold tracking-tight text-slate-800">2026 미래융합부</h1>
                            </div>
                            <span className="text-xs font-medium px-2 py-1 bg-slate-100 text-slate-500 rounded-full">안내 시스템</span>
                        </div>
                    </header>

                    <div className="max-w-5xl mx-auto px-4 py-6 md:flex md:gap-8">
                        {/* Desktop Side Nav */}
                        <nav className="hidden md:block w-64 space-y-2">
                            <button 
                                onClick={() => setActiveTab('dashboard')}
                                className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all ${activeTab === 'dashboard' ? 'bg-blue-600 text-white shadow-lg' : 'bg-white text-slate-600 hover:bg-slate-100'}`}
                            >
                                <Icon name="home" size={20} />
                                <span className="font-medium">대시보드</span>
                            </button>
                            <div className="pt-4 pb-2 px-4 text-[10px] font-bold text-slate-400 uppercase tracking-widest">운영 활동</div>
                            {activities.map(act => (
                                <button 
                                    key={act.id}
                                    onClick={() => setActiveTab(act.id)}
                                    className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all ${activeTab === act.id ? 'bg-blue-600 text-white shadow-lg' : 'bg-white text-slate-600 hover:bg-slate-100'}`}
                                >
                                    <Icon name={act.icon} size={20} />
                                    <span className="font-medium truncate">{act.title}</span>
                                </button>
                            ))}
                        </nav>

                        {/* Content */}
                        <main className="flex-1">
                            {activeTab === 'dashboard' ? (
                                <div className="space-y-6">
                                    <div className="bg-gradient-to-br from-blue-600 to-indigo-700 rounded-3xl p-8 text-white shadow-xl relative overflow-hidden">
                                        <div className="relative z-10">
                                            <h2 className="text-2xl font-bold mb-2">반갑습니다, 선생님! 👋</h2>
                                            <p className="text-blue-100 opacity-90 leading-relaxed max-w-md">
                                                2026학년도 미래융합부 교육활동 가이드입니다. <br/>
                                                학생 상담 및 생기부 기록 시 참고해 주세요.
                                            </p>
                                        </div>
                                        <Icon name="sparkles" size={120} className="absolute -right-8 -bottom-8 text-white/10 rotate-12" />
                                    </div>

                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                        {activities.map(act => (
                                            <div key={act.id} onClick={() => setActiveTab(act.id)} className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm hover:shadow-md transition-all cursor-pointer group active:scale-[0.98]">
                                                <div className="flex justify-between items-start mb-4">
                                                    <div className={`${act.color} p-3 rounded-xl text-white shadow-sm`}>
                                                        <Icon name={act.icon} size={24} />
                                                    </div>
                                                    <span className="text-[10px] font-bold px-2 py-1 bg-slate-100 text-slate-500 rounded-md">
                                                        {act.period.split(',')[0]}
                                                    </span>
                                                </div>
                                                <h3 className="text-lg font-bold text-slate-800 mb-1">{act.title}</h3>
                                                <p className="text-xs text-slate-500 line-clamp-1 mb-4">{act.target}</p>
                                                <div className="flex items-center text-blue-600 text-sm font-bold group-hover:translate-x-1 transition-transform">
                                                    자세히 보기 <Icon name="chevron-right" size={16} />
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            ) : (
                                <div className="animate-in space-y-6">
                                    {activities.filter(a => a.id === activeTab).map(act => (
                                        <div key={act.id} className="bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden">
                                            <div className={`${act.color} p-6 text-white flex items-center justify-between`}>
                                                <div className="flex items-center gap-4">
                                                    <div className="bg-white/20 p-3 rounded-2xl backdrop-blur-md">
                                                        <Icon name={act.icon} size={28} />
                                                    </div>
                                                    <div>
                                                        <h2 className="text-2xl font-bold">{act.title}</h2>
                                                        <p className="text-white/80 text-sm font-medium">{act.period}</p>
                                                    </div>
                                                </div>
                                                <button onClick={() => setActiveTab('dashboard')} className="p-2 hover:bg-white/10 rounded-full transition-colors">
                                                    <Icon name="x" size={24} />
                                                </button>
                                            </div>

                                            <div className="p-6 space-y-8">
                                                <section>
                                                    <h4 className="flex items-center gap-2 text-slate-800 font-bold mb-4">
                                                        <Icon name="info" className="text-blue-600" size={20} /> 주요 활동 내용
                                                    </h4>
                                                    <ul className="space-y-3 text-sm text-slate-600 leading-relaxed">
                                                        {act.details.map((detail, idx) => (
                                                            <li key={idx} className="flex gap-3">
                                                                <div className={`mt-1.5 w-1.5 h-1.5 rounded-full shrink-0 ${act.color}`} /> 
                                                                {detail}
                                                            </li>
                                                        ))}
                                                    </ul>
                                                </section>

                                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                    <div className="bg-slate-50 p-5 rounded-2xl border border-slate-100">
                                                        <span className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">대상 학생</span>
                                                        <p className="text-slate-800 text-sm font-bold mt-1">{act.target}</p>
                                                    </div>
                                                    <div className="bg-slate-50 p-5 rounded-2xl border border-slate-100">
                                                        <span className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">참여 혜택</span>
                                                        <p className="text-slate-800 text-sm font-bold mt-1 flex items-center gap-2">
                                                            <Icon name="gift" size={16} className="text-amber-500" />
                                                            {act.benefit}
                                                        </p>
                                                    </div>
                                                </div>

                                                {act.recordPoint ? (
                                                    <section className="bg-indigo-50/50 border border-indigo-100 rounded-3xl p-6">
                                                        <div className="flex items-center justify-between mb-4">
                                                            <h4 className="flex items-center gap-2 text-indigo-900 font-bold">
                                                                <Icon name="clipboard-check" size={22} className="text-indigo-600" /> 
                                                                생기부 기재 추천 키워드
                                                            </h4>
                                                            <button 
                                                                onClick={() => handleCopy(act.recordPoint, act.id)}
                                                                className={`flex items-center gap-2 text-xs font-bold px-4 py-2 rounded-full shadow-sm transition-all active:scale-95 ${copiedId === act.id ? 'bg-green-500 text-white' : 'bg-white text-indigo-700 hover:bg-indigo-50 border border-indigo-200'}`}
                                                            >
                                                                <Icon name={copiedId === act.id ? "check" : "copy"} size={14} />
                                                                {copiedId === act.id ? '복사완료' : '키워드 복사'}
                                                            </button>
                                                        </div>
                                                        <div className="bg-white p-4 rounded-xl border border-indigo-100/50 text-indigo-800 text-sm leading-relaxed shadow-sm">
                                                            "{act.recordPoint}"
                                                        </div>
                                                    </section>
                                                ) : (
                                                    <div className="bg-blue-50 border border-blue-100 rounded-2xl p-5 flex items-start gap-4">
                                                        <Icon name="alert-circle" className="text-blue-500 shrink-0" size={24} />
                                                        <div className="text-sm text-blue-800 leading-relaxed">
                                                            <p className="font-bold mb-1">안내사항</p>
                                                            본 활동은 별도의 서술형 기재 없이 <strong>봉사활동 시간</strong>으로 기록됩니다. 
                                                            나이스(NEIS) 봉사활동 내역을 확인해 주세요.
                                                        </div>
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </main>
                    </div>

                    {/* Mobile Navigation */}
                    <nav className="md:hidden fixed bottom-0 left-0 right-0 bg-white/80 backdrop-blur-lg border-t border-slate-200 px-4 py-3 flex justify-between items-center z-30 shadow-[0_-4px_20px_rgba(0,0,0,0.05)]">
                        <button onClick={() => setActiveTab('dashboard')} className={`flex flex-col items-center gap-1 min-w-[60px] ${activeTab === 'dashboard' ? 'text-blue-600' : 'text-slate-400'}`}>
                            <Icon name="home" size={20} />
                            <span className="text-[9px] font-bold">홈</span>
                        </button>
                        {activities.map(act => (
                            <button key={act.id} onClick={() => setActiveTab(act.id)} className={`flex flex-col items-center gap-1 min-w-[60px] ${activeTab === act.id ? 'text-blue-600' : 'text-slate-400'}`}>
                                <Icon name={act.icon} size={20} />
                                <span className="text-[9px] font-bold uppercase truncate w-12 text-center">{act.id}</span>
                            </button>
                        ))}
                    </nav>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
